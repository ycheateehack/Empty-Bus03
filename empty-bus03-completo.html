<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty-Bus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
[hidden] { display: none !important; }
body { background-color: #6f10ad; min-height: 100dvh; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.app-container { width: 100%; max-width: 430px; min-height: 100dvh; margin: 0 auto; position: relative; }
.main-screen { background-color: #9900FF; color: #FFFFFF; padding: 20px 16px 32px; }

/* topo */
.app-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
.user-info h1 { font-size: 1.4rem; line-height: 1.2; }
.user-info p { font-size: .8rem; opacity: .95; margin-top: 2px; }
.user-avatar {
    width: 48px; height: 48px; flex: none; border: 0; border-radius: 50%;
    background: #FFFFFF; color: #1b1630; font-size: 1.15rem;
    display: grid; place-items: center; cursor: pointer;
}
.topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.topbar h1 { font-size: 1.4rem; line-height: 1.2; }
.back { color: #FFFFFF; font-size: 1.2rem; padding: 4px; text-decoration: none; }

/* busca */
.search-box {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    background: #E2D1F9; color: #6b5f80; border-radius: 12px; padding: 0 14px;
}
.search-box input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 13px 0; font-size: .9rem; color: #1b1630; }
.search-box input::placeholder { color: #6b5f80; }
.search-box:focus-within { outline: 3px solid #fff; outline-offset: 2px; }

/* atalhos */
.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 26px; }
.action-card { background: #FFFFFF; color: #1b1630; border-radius: 12px; padding: 16px 14px; text-decoration: none; display: grid; gap: 2px; }
.action-card > i { font-size: 1.6rem; color: #0052CC; margin-bottom: 14px; }
.action-card h3 { font-size: .9rem; }
.action-card p { font-size: .7rem; color: #4a4458; }

/* filtros */
.chips { display: flex; gap: 10px; margin-bottom: 16px; }
.chip { border: 0; border-radius: 999px; padding: 7px 18px; font-size: .8rem; font-weight: 600; background: #FFFFFF; color: #1b1630; cursor: pointer; }
.chip[aria-pressed="true"] { background: #1f4fe0; color: #FFFFFF; }

/* lista */
.section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.section-header h2 { font-size: 1.05rem; }
.see-all { color: #5cf1ff; font-size: .85rem; text-decoration: none; }
.bus-list { display: grid; gap: 14px; }
.bus-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; border-radius: 12px; padding: 14px; cursor: pointer; }
.bus-item.dark { background: rgba(255, 255, 255, .2); padding-block: 22px; }
.bus-item.light { background: #eaf3f1; color: #1b1630; }
.bus-number { min-width: 52px; text-align: center; padding: 9px 6px; border-radius: 8px; color: #FFFFFF; font-weight: 700; font-size: 1.05rem; }
.badge-201 { background-color: #0052CC; }
.badge-307 { background-color: #2E7D32; }
.badge-412 { background-color: #311B92; }
.bus-details { display: grid; gap: 2px; font-size: .75rem; }
.bus-details h4 { font-size: .85rem; }
.bus-side { display: grid; justify-items: end; gap: 8px; }
.bus-time { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.bus-row { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px; font-size: .7rem; font-weight: 600; }
.pill.full  { background: #ffb3b3; color: #a4191a; }
.pill.mid   { background: #fde0a8; color: #8a4f00; }
.pill.empty { background: #bff0d0; color: #17683a; }
.fav { border: 0; background: none; color: #8a6d00; font-size: 1rem; cursor: pointer; padding: 2px; }
.light :focus-visible { outline-color: #1b1630; }
.bus-empty { text-align: center; padding: 28px 8px; opacity: .9; }

/* banner */
.footer-banner {
    display: flex; align-items: center; gap: 14px; margin-top: 26px;
    background: #FFFFFF; color: #1b1630; border-radius: 12px; padding: 16px; text-decoration: none;
}
.footer-banner > i { font-size: 1.8rem; color: #0052CC; }
.footer-banner strong { display: block; font-size: .9rem; }
.footer-banner small { font-size: .7rem; color: #4a4458; }

body { background-color: #6f10ad; min-height: 100dvh; }

.app-container {

    <script>
'use strict';

/**
 * Empty-Bus - autenticação (cadastro, login, sessão)
 *
 * ATENÇÃO: esta é uma implementação 100% no navegador (localStorage), útil para
 * protótipo/demonstração. Não existe segurança real sem um servidor: quando houver
 * backend, troque register()/login() por chamadas fetch() à sua API.
 * As senhas nunca são guardadas em texto puro (PBKDF2 + salt aleatório).
 */
const Auth = (() => {
  const USERS_KEY = 'painel:usuarios';
  const SESSION_KEY = 'painel:sessao';
  const LOGIN_PAGE = '#login';
  const HOME_PAGE = '#inicio';

  // ---------- Armazenamento seguro (try/catch) ----------
  const read = (key, fallback) => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  };
  const write = (key, value) => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  };

  // ---------- Utilitários ----------
  const normalizeEmail = (email) => String(email || '').trim().toLowerCase();
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  const toHex = (buf) =>
    [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  const fromHex = (hex) =>
    new Uint8Array(hex.match(/.{2}/g).map((h) => parseInt(h, 16)));

  async function hashPassword(password, saltHex) {
    const salt = saltHex
      ? fromHex(saltHex)
      : crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(password),
      'PBKDF2',
      false,
      ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      key,
      256
    );
    return { hash: toHex(bits), salt: toHex(salt) };
  }

  // ---------- Validação ----------
  function validateRegistration({ name, email, password, confirm }) {
    const errors = {};
    if (!String(name || '').trim() || String(name).trim().length < 2)
      errors.name = 'Informe seu nome (mínimo 2 letras).';
    if (!EMAIL_RE.test(normalizeEmail(email))) errors.email = 'Informe um e-mail válido.';
    if (!password || password.length < 8)
      errors.password = 'A senha deve ter pelo menos 8 caracteres.';
    else if (!/[A-Za-z]/.test(password) || !/\d/.test(password))
      errors.password = 'Use letras e números na senha.';
    if (password !== confirm) errors.confirm = 'As senhas não coincidem.';
    return errors;
  }

  // ---------- Operações ----------
  async function register({ name, email, password, confirm }) {
    const errors = validateRegistration({ name, email, password, confirm });
    if (Object.keys(errors).length) return { ok: false, errors };

    const users = read(USERS_KEY, []);
    const mail = normalizeEmail(email);
    if (users.some((u) => u.email === mail))
      return { ok: false, errors: { email: 'Este e-mail já está cadastrado.' } };

    const { hash, salt } = await hashPassword(password);
    users.push({
      id: crypto.randomUUID(),
      name: String(name).trim(),
      email: mail,
      hash,
      salt,
      createdAt: Date.now(),
    });
    if (!write(USERS_KEY, users))
      return { ok: false, errors: { form: 'Não foi possível salvar o cadastro neste navegador.' } };

    return { ok: true };
  }

  async function login({ email, password, remember }) {
    const mail = normalizeEmail(email);
    if (!EMAIL_RE.test(mail) || !password)
      return { ok: false, errors: { form: 'Informe e-mail e senha.' } };

    const user = read(USERS_KEY, []).find((u) => u.email === mail);
    // Mesma mensagem para e-mail inexistente ou senha errada (não revela qual existe)
    const invalid = { ok: false, errors: { form: 'E-mail ou senha incorretos.' } };
    if (!user) {
      await hashPassword(password); // equaliza o tempo de resposta
      return invalid;
    }
    const { hash } = await hashPassword(password, user.salt);
    if (hash !== user.hash) return invalid;

    const session = { id: user.id, name: user.name, email: user.email, at: Date.now() };
    // "Lembrar de mim" -> localStorage; caso contrário -> sessionStorage
    try {
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
    } catch {
      return { ok: false, errors: { form: 'Não foi possível iniciar a sessão neste navegador.' } };
    }
    return { ok: true, user: session };
  }

  function currentUser() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function logout() {
    try {
      sessionStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(SESSION_KEY);
    } catch {
      /* ignora */
    }
    window.location.replace(LOGIN_PAGE);
  }

  /** Chame nas páginas privadas: redireciona para o login se não houver sessão. */
  function requireLogin() {
    const user = currentUser();
    if (!user) {
      window.location.replace(LOGIN_PAGE);
      return null;
    }
    return user;
  }

  /** Chame na página de login: se já estiver logado, vai para a home. */
  function redirectIfLoggedIn() {
    if (currentUser()) window.location.replace(HOME_PAGE);
  }

  return { register, login, logout, currentUser, requireLogin, redirectIfLoggedIn, HOME_PAGE };
})();

    <script>
'use strict';

/** Empty-Bus - tela de login/cadastro */
(() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const tabLogin = $('#tab-login');
  const tabRegister = $('#tab-register');
  const formLogin = $('#form-login');
  const formRegister = $('#form-register');
  const message = $('#auth-message');

  // ---------- Abas ----------
  function showTab(which) {
    const isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    tabLogin.setAttribute('aria-selected', String(isLogin));
    tabRegister.setAttribute('aria-selected', String(!isLogin));
    formLogin.hidden = !isLogin;
    formRegister.hidden = isLogin;
    clearErrors(formLogin);
    clearErrors(formRegister);
    if (isLogin === false) message.hidden = true;
  }
  tabLogin.addEventListener('click', () => showTab('login'));
  tabRegister.addEventListener('click', () => showTab('register'));

  // ---------- Erros ----------
  function clearErrors(form) {
    form.querySelectorAll('[data-error-for]').forEach((n) => (n.textContent = ''));
    form.querySelectorAll('.field').forEach((f) => f.classList.remove('invalid'));
  }

  function showErrors(form, errors = {}) {
    clearErrors(form);
    Object.entries(errors).forEach(([field, text]) => {
      const target = form.querySelector(`[data-error-for="${field}"]`);
      if (target) target.textContent = text;
      const input = form.querySelector(`[name="${field}"]`);
      if (input) input.closest('.field')?.classList.add('invalid');
    });
    const first = form.querySelector('.field.invalid input');
    if (first) first.focus();
  }

  // ---------- Mostrar/ocultar senha ----------
  document.querySelectorAll('.toggle-pass').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
      btn.firstElementChild.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });
  });

  // ---------- Envio ----------
  async function withLoading(form, fn) {
    const btn = $('.submit-btn', form);
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Aguarde...';
    try {
      await fn();
    } catch (err) {
      console.error(err);
      showErrors(form, { form: 'Ocorreu um erro inesperado. Tente novamente.' });
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  formLogin.addEventListener('submit', (e) => {
    e.preventDefault();
    withLoading(formLogin, async () => {
      const data = new FormData(formLogin);
      const result = await Auth.login({
        email: data.get('email'),
        password: data.get('password'),
        remember: data.get('remember') === 'on',
      });
      if (!result.ok) return showErrors(formLogin, result.errors);
      formLogin.reset();
      window.location.replace(Auth.HOME_PAGE);
    });
  });

  formRegister.addEventListener('submit', (e) => {
    e.preventDefault();
    withLoading(formRegister, async () => {
      const data = new FormData(formRegister);
      const result = await Auth.register({
        name: data.get('name'),
        email: data.get('email'),
        password: data.get('password'),
        confirm: data.get('confirm'),
      });
      if (!result.ok) return showErrors(formRegister, result.errors);

      const email = data.get('email');
      formRegister.reset();
      showTab('login');
      $('#login-email').value = String(email).trim();
      message.textContent = 'Conta criada com sucesso! Entre com seu e-mail e senha.';
      message.hidden = false;
      $('#login-password').focus();
    });
  });

  // Se o navegador não suportar Web Crypto (ex.: página aberta fora de HTTPS/localhost)
  if (!window.crypto || !crypto.subtle || !crypto.randomUUID) {
    message.textContent =
      'Este navegador/contexto não suporta criptografia. Abra a página via localhost ou HTTPS.';
    message.style.background = '#FDECEA';
    message.style.color = '#B3261E';
    message.hidden = false;
  }
})();

'use strict';

/**
 * Empty-Bus - telas "Próximos ônibus" (#) e "Linhas de ônibus" (#linhas)
 *  - Saudação conforme o horário e nome do usuário logado
 *  - Cards com tempo, lotação (Cheio/Moderado/Vazio) e relatos
 *  - Busca com debounce; Enter na tela inicial leva ao mapa
 *  - Filtros Todas / Mais próximos / Favoritos (linhas favoritas ficam no navegador)
 *  - Contagem regressiva simulada
 *
 * Quando houver API real, basta substituir BUSES por um fetch().
 */
(() => {
  // ---------- Dados (mock) ----------
  const BUSES = [
    { line: '201', name: 'Terminal Central', direction: 'Centro', minutes: 3,  status: 'Cheio',    reports: 3 },
    { line: '307', name: 'Joana Bezerra',    direction: 'Centro', minutes: 7,  status: 'Vazio',    reports: 3 },
    { line: '412', name: 'Boa Vista',        direction: 'Centro', minutes: 12, status: 'Moderado', reports: 3 },
    { line: '518', name: 'Derby',            direction: 'Centro', minutes: 18, status: 'Moderado', reports: 2, color: '#8e44ad' },
    { line: '623', name: 'Boa Viagem',       direction: 'Centro', minutes: 25, status: 'Vazio',    reports: 1, color: '#16a085' },
  ];
  const HOME_COUNT = 3;
  const NEAR_MINUTES = 10;
  const TICK_MS = 60_000;
  const FAV_KEY = 'painel:linhas-favoritas';
  const STATUS_CLASS = { Cheio: 'full', Moderado: 'mid', Vazio: 'empty' };

  // ---------- Utilitários ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const normalize = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const debounce = (fn, delay = 200) => {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), delay); };
  };
  const el = (tag, className, text) => {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const favorites = (() => {
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch { return new Set(); }
  })();
  const saveFavorites = () => {
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch { /* segue sem persistir */ }
  };

  // ---------- Estado e elementos ----------
  const state = { buses: BUSES.map((b) => ({ ...b })), qHome: '', qLines: '', filter: 'all' };
  const viewHome = $('#view-home');
  const viewLines = $('#view-lines');
  const listHome = $('#list-home');
  const listLines = $('#list-lines');
  const matches = (b, q) => {
    const n = normalize(q);
    return !n || [b.line, b.name, b.direction].some((v) => normalize(v).includes(n));
  };
  const formatTime = (min) => (min <= 0 ? 'Chegando ›' : `${min} min ›`);

  // ---------- Saudação ----------
  function renderGreeting() {
    const h = new Date().getHours();
    const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    const user = Auth.currentUser();
    const first = user && user.name ? user.name.split(' ')[0] : 'usuário';
    $('.user-info h1').textContent = `${greet}, ${first}!`;
  }

  // ---------- Cards ----------
  function buildItem(bus, theme) {
    const item = el('div', `bus-item ${theme}`);
    item.tabIndex = 0;
    item.setAttribute('role', 'link');
    item.setAttribute('aria-label', `Linha ${bus.line}, ${bus.name}, ${formatTime(bus.minutes)}, ${bus.status}`);

    const badge = el('div', `bus-number badge-${bus.line}`, bus.line);
    if (bus.color) badge.style.background = bus.color;

    const details = el('div', 'bus-details');
    details.append(el('strong', '', bus.name), el('span', '', `Direção: ${bus.direction}`));
    if (theme === 'dark') details.append(el('span', '', `Relatos: ${bus.reports}`));

    const time = el('div', 'bus-time', formatTime(bus.minutes));
    time.dataset.line = bus.line;

    const pill = el('span', `pill ${STATUS_CLASS[bus.status]}`);
    pill.append(el('i', 'fa-solid fa-bus'), ` ${bus.status}`);

    const top = el('div', 'bus-row');
    if (theme === 'light') top.append(buildFav(bus));
    top.append(time);

    const side = el('div', 'bus-side');
    side.append(top, pill);
    item.append(badge, details, side);

    const go = () => { window.location.href = `#mapa?linha=${encodeURIComponent(bus.line)}`; };
    item.addEventListener('click', go);
    item.addEventListener('keydown', (e) => {
      if (e.target === item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go(); }
    });
    return item;
  }

  function buildFav(bus) {
    const btn = el('button', 'fav');
    btn.type = 'button';
    const paint = () => {
      const on = favorites.has(bus.line);
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-label', on ? `Remover linha ${bus.line} dos favoritos` : `Favoritar linha ${bus.line}`);
      btn.replaceChildren(el('i', `${on ? 'fa-solid' : 'fa-regular'} fa-star`));
    };
    paint();
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      favorites.has(bus.line) ? favorites.delete(bus.line) : favorites.add(bus.line);
      saveFavorites();
      state.filter === 'fav' ? renderLines() : paint();
    });
    return btn;
  }

  // ---------- Listas ----------
  function fill(list, items, theme, emptyText) {
    list.replaceChildren();
    if (!items.length) return list.append(el('p', 'bus-empty', emptyText));
    items.forEach((b) => list.append(buildItem(b, theme)));
  }

  function renderHome() {
    const searching = state.qHome.trim() !== '';
    const found = state.buses.filter((b) => matches(b, state.qHome));
    fill(listHome, searching ? found : found.slice(0, HOME_COUNT), 'dark',
      'Nenhuma linha encontrada. Pressione Enter para buscar no mapa.');
  }

  function renderLines() {
    let items = state.buses.filter((b) => matches(b, state.qLines));
    if (state.filter === 'near') items = items.filter((b) => b.minutes <= NEAR_MINUTES);
    if (state.filter === 'fav') items = items.filter((b) => favorites.has(b.line));
    fill(listLines, items, 'light',
      state.filter === 'fav' ? 'Você ainda não tem linhas favoritas.' : 'Nenhuma linha encontrada.');
  }

  function tick() {
    state.buses.forEach((b) => {
      b.minutes -= 1;
      if (b.minutes < 0) b.minutes = 15 + Math.floor(Math.random() * 15);
    });
    state.buses.forEach((b) => {
      document.querySelectorAll(`.bus-time[data-line="${b.line}"]`).forEach((t) => (t.textContent = formatTime(b.minutes)));
    });
  }

  // ---------- Navegação entre as duas telas ----------
  function route() {
    const lines = location.hash === '#linhas';
    viewHome.hidden = lines;
    viewLines.hidden = !lines;
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  // ---------- Eventos ----------
  const onHomeSearch = debounce((v) => { state.qHome = v; renderHome(); });
  const onLinesSearch = debounce((v) => { state.qLines = v; renderLines(); });
  $('#q-home').addEventListener('input', (e) => onHomeSearch(e.target.value));
  $('#q-lines').addEventListener('input', (e) => onLinesSearch(e.target.value));
  $('#q-home').addEventListener('keydown', (e) => {
    const q = e.target.value.trim();
    if (e.key === 'Enter' && q) window.location.href = `#mapa?q=${encodeURIComponent(q)}`;
  });

  $('#chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.filter = chip.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
    renderLines();
  });

  $('#logout-btn').addEventListener('click', () => Auth.logout());

  // ---------- Init ----------
  window.addEventListener('painel:route', renderGreeting);
  renderGreeting();
  renderHome();
  renderLines();
  route();
  setInterval(tick, TICK_MS);
})();

    <script>
'use strict';

/**
 * Empty-Bus - tela do mapa
 * Usa Leaflet + OpenStreetMap.
 *  - Mapa interativo centrado no Recife
 *  - Paradas (mock) com popup e botão de favoritar
 *  - Favoritos persistidos em localStorage
 *  - Geolocalização do usuário
 *  - Alternância de camada (ruas / satélite)
 *  - Busca por parada ou linha (também via ?q= e ?linha=)
 *  - Bottom sheet com listas
 *
 * As coordenadas são aproximadas e servem de exemplo: troque STOPS por dados da sua API.
 */
(() => {
  // ---------- Dados (mock) ----------
  const STOPS = [
    { id: 'ti-joana-bezerra', name: 'Terminal Integrado Joana Bezerra', lat: -8.0716, lng: -34.8894, lines: ['307'] },
    { id: 'terminal-central', name: 'Terminal Central', lat: -8.0631, lng: -34.8808, lines: ['201'] },
    { id: 'boa-vista', name: 'Boa Vista', lat: -8.0589, lng: -34.8896, lines: ['412'] },
    { id: 'derby', name: 'Praça do Derby', lat: -8.0536, lng: -34.8995, lines: ['518', '201'] },
    { id: 'marco-zero', name: 'Marco Zero', lat: -8.0630, lng: -34.8711, lines: ['201', '307'] },
    { id: 'boa-viagem', name: 'Boa Viagem', lat: -8.1190, lng: -34.9000, lines: ['623'] },
  ];
  const RECIFE = [-8.0476, -34.877];
  const FAV_KEY = 'painel:favoritos';

  // ---------- Utilitários ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const normalize = (s) =>
    String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

  const el = (tag, className, text) => {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  const storage = {
    read() {
      try {
        return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []);
      } catch {
        return new Set();
      }
    },
    write(set) {
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify([...set]));
      } catch {
        /* storage indisponível: segue sem persistir */
      }
    },
  };

  const favorites = storage.read();

  // ---------- Toast ----------
  let toastTimer;
  function toast(message) {
    let t = $('#toast');
    if (!t) {
      t = el('div');
      t.id = 'toast';
      t.setAttribute('role', 'status');
      t.style.cssText =
        'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;' +
        'padding:10px 16px;border-radius:20px;font-size:14px;z-index:2000;max-width:90%;text-align:center;';
      document.body.appendChild(t);
    }
    t.textContent = message;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.style.display = 'none'), 3000);
  }

  // ---------- Elementos ----------
  const mapEl = $('.map-placeholder');
  const searchInput = $('.floating-search-bar input');
  const clearBtn = $('.clear-btn');
  const [locateBtn, layerBtn] = document.querySelectorAll('.control-btn');
  const [favBtn, stopsBtn] = document.querySelectorAll('.sheet-button');
  const sheet = $('.bottom-sheet');
  const handle = $('.drag-handle');

  if (typeof L === 'undefined') {
    toast('Não foi possível carregar o mapa. Verifique sua conexão.');
    return;
  }

  // Garante que o mapa tenha dimensão e que a UI flutue acima das camadas do Leaflet
  mapEl.id = 'map';
  mapEl.style.position = 'absolute';
  mapEl.style.inset = '0';
  [$('.floating-search-bar'), $('.floating-controls'), sheet].forEach((n) => {
    if (n) n.style.zIndex = 1000;
  });

  // ---------- Mapa ----------
  const map = L.map(mapEl, { zoomControl: false }).setView(RECIFE, 13);

  const baseLayers = {
    ruas: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap',
    }),
    satelite: L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
    ),
  };
  let currentBase = 'ruas';
  baseLayers[currentBase].addTo(map);

  const stopsLayer = L.layerGroup().addTo(map);
  const markers = new Map(); // id -> marker

  const stopIcon = (isFav) =>
    L.divIcon({
      className: 'stop-marker',
      html: `<div style="width:30px;height:30px;border-radius:50%;background:${isFav ? '#f1c40f' : '#1e6fff'};
        color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff;
        box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:14px;"><i class="fa-solid fa-bus"></i></div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -14],
    });

  function buildPopup(stop) {
    const box = el('div');
    box.append(el('strong', '', stop.name), el('br'));
    box.append(el('span', '', `Linhas: ${stop.lines.join(', ')}`), el('br'));

    const btn = el('button', '', favorites.has(stop.id) ? '★ Remover dos favoritos' : '☆ Favoritar');
    btn.style.cssText = 'margin-top:8px;padding:6px 10px;border:0;border-radius:8px;background:#1e6fff;color:#fff;cursor:pointer;';
    btn.addEventListener('click', () => {
      toggleFavorite(stop.id);
      btn.textContent = favorites.has(stop.id) ? '★ Remover dos favoritos' : '☆ Favoritar';
    });
    box.appendChild(btn);
    return box;
  }

  STOPS.forEach((stop) => {
    const m = L.marker([stop.lat, stop.lng], {
      icon: stopIcon(favorites.has(stop.id)),
      title: stop.name,
      keyboard: true,
    }).bindPopup(() => buildPopup(stop));
    markers.set(stop.id, m);
    m.addTo(stopsLayer);
  });

  // ---------- Favoritos ----------
  function toggleFavorite(id) {
    const wasFav = favorites.has(id);
    wasFav ? favorites.delete(id) : favorites.add(id);
    storage.write(favorites);
    markers.get(id)?.setIcon(stopIcon(!wasFav));
    toast(wasFav ? 'Removido dos favoritos' : 'Adicionado aos favoritos');
    if (panelMode) renderPanel();
  }

  // ---------- Painel inferior ----------
  const panel = el('div', 'sheet-list');
  panel.hidden = true;
  panel.style.cssText = 'max-height:40vh;overflow-y:auto;margin-top:12px;';
  sheet.appendChild(panel);
  let panelMode = null; // 'favoritos' | 'paradas' | null

  function focusStop(stop) {
    map.flyTo([stop.lat, stop.lng], 16, { duration: 0.8 });
    markers.get(stop.id)?.openPopup();
  }

  function renderPanel() {
    const items =
      panelMode === 'favoritos' ? STOPS.filter((s) => favorites.has(s.id)) : STOPS;

    panel.replaceChildren();

    if (!items.length) {
      const p = el('p', '', 'Você ainda não tem favoritos. Toque em uma parada no mapa para favoritar.');
      p.style.cssText = 'text-align:center;color:#fff;opacity:.85;padding:12px;';
      panel.appendChild(p);
      return;
    }

    items.forEach((stop) => {
      const row = el('button', 'sheet-row');
      row.type = 'button';
      row.style.cssText =
        'display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;' +
        'background:none;border:0;border-bottom:1px solid rgba(255,255,255,.25);text-align:left;cursor:pointer;font:inherit;color:#fff;';
      const info = el('span');
      info.append(el('strong', '', stop.name), el('br'), el('small', '', `Linhas: ${stop.lines.join(', ')}`));
      row.append(info, el('span', '', favorites.has(stop.id) ? '★' : ''));
      row.addEventListener('click', () => focusStop(stop));
      panel.appendChild(row);
    });
  }

  function setPanel(mode) {
    panelMode = panelMode === mode ? null : mode;
    panel.hidden = panelMode === null;
    favBtn.classList.toggle('active', panelMode === 'favoritos');
    stopsBtn.classList.toggle('active', panelMode === 'paradas');
    if (panelMode) renderPanel();
  }

  favBtn.addEventListener('click', () => setPanel('favoritos'));
  stopsBtn.addEventListener('click', () => setPanel('paradas'));
  handle.style.cursor = 'pointer';
  handle.addEventListener('click', () => {
    panelMode = null;
    panel.hidden = true;
    favBtn.classList.remove('active');
    stopsBtn.classList.remove('active');
  });

  // ---------- Controles flutuantes ----------
  let userMarker;
  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) return toast('Geolocalização não suportada neste navegador.');
    toast('Buscando sua localização...');
    navigator.geolocation.getCurrentPosition(
      ({ coords }) => {
        const pos = [coords.latitude, coords.longitude];
        userMarker?.remove();
        userMarker = L.circleMarker(pos, {
          radius: 8, color: '#fff', weight: 3, fillColor: '#1e6fff', fillOpacity: 1,
        }).addTo(map);
        map.flyTo(pos, 16);
      },
      (err) =>
        toast(err.code === err.PERMISSION_DENIED
          ? 'Permissão de localização negada.'
          : 'Não foi possível obter sua localização.'),
      { enableHighAccuracy: true, timeout: 10_000 }
    );
  });

  layerBtn.addEventListener('click', () => {
    map.removeLayer(baseLayers[currentBase]);
    currentBase = currentBase === 'ruas' ? 'satelite' : 'ruas';
    baseLayers[currentBase].addTo(map).bringToBack();
    toast(currentBase === 'ruas' ? 'Camada: ruas' : 'Camada: satélite');
  });

  // ---------- Busca ----------
  function search(query) {
    const q = normalize(query);
    if (!q) return resetView();

    const found = STOPS.filter(
      (s) => normalize(s.name).includes(q) || s.lines.some((l) => normalize(l).includes(q))
    );

    if (!found.length) return toast('Nenhuma parada ou linha encontrada.');

    stopsLayer.clearLayers();
    found.forEach((s) => markers.get(s.id).addTo(stopsLayer));

    if (found.length === 1) focusStop(found[0]);
    else map.flyToBounds(L.latLngBounds(found.map((s) => [s.lat, s.lng])), { padding: [60, 60] });
  }

  function resetView() {
    stopsLayer.clearLayers();
    markers.forEach((m) => m.addTo(stopsLayer));
  }

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') search(searchInput.value);
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    resetView();
    searchInput.focus();
  });

  // ---------- Entrada na tela (#mapa?q= / #mapa?linha=) ----------
  window.addEventListener('painel:route', (e) => {
    if (e.detail.name !== 'mapa') return;
    setTimeout(() => map.invalidateSize(), 0); // o mapa nasce escondido: recalcula o tamanho
    const params = new URLSearchParams(e.detail.query);
    const initial = params.get('linha') || params.get('q') || '';
    searchInput.value = initial;
    initial ? search(initial) : resetView();
  });
})();

    </script>
    <script>
'use strict';

/** Empty-Bus - navegação entre as telas (#login, #inicio, #linhas, #mapa) */
(() => {
  const screens = {
    login: document.getElementById('screen-login'),
    app: document.getElementById('screen-app'),
    map: document.getElementById('screen-map'),
  };

  function route() {
    const [name, query = ''] = location.hash.slice(1).split('?');
    const user = Auth.currentUser();

    if (!user && name !== 'login') return location.replace('#login');
    if (user && !['inicio', 'linhas', 'mapa'].includes(name)) return location.replace('#inicio');

    const current = name === 'login' ? 'login' : name === 'mapa' ? 'map' : 'app';
    Object.entries(screens).forEach(([key, node]) => (node.hidden = key !== current));
    document.title = name === 'login' ? 'Entrar - Empty-Bus' : name === 'mapa' ? 'Mapa de Linhas' : 'Empty-Bus';
    window.dispatchEvent(new CustomEvent('painel:route', { detail: { name, query } }));
  }

  window.addEventListener('hashchange', route);
  route();
})();

    </script>
